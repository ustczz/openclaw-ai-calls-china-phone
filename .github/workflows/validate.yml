name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/growth-v2

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python3 -m compileall -q scripts skill/scripts tests
      - name: Check shell wrappers
        run: find . -maxdepth 2 -name '*.sh' -print0 | xargs -0 -n1 sh -n

